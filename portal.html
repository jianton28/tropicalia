<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión | Tropicalia</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container" style="max-width: 440px; margin-top: 60px; margin-bottom: 60px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html" style="color: var(--gold); text-decoration: none; font-size: 0.85rem;">← Volver al Catálogo</a>
      <h1 style="font-size: 1.9rem; margin: 8px 0 4px 0; color: #fff;">Tropicalia</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Acceso unificado para Clientes, Aliados y Repartidores</p>
    </div>

    <div class="card">
      <form id="form-login">
        <label>Correo Electrónico:</label>
        <input type="email" id="login-email" required placeholder="tucorreo@tropicalia.com" />

        <label>Contraseña:</label>
        <input type="password" id="login-pass" required placeholder="••••••••" />

        <button type="submit" id="btn-login" class="btn-primario" style="width: 100%; margin-top: 6px; padding: 12px;">
          Ingresar a mi Cuenta
        </button>
      </form>

      <div id="login-error" style="display: none; background: rgba(239,68,68,0.15); border: 1px solid var(--red); color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 12px;"></div>

      <div style="border-top: 1px solid var(--border-color); margin-top: 20px; padding-top: 16px; text-align: center;">
        <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0 0 10px 0;">¿Aún no tienes cuenta en Tropicalia?</p>
        <a href="registro.html" class="btn-secundario" style="width: 100%; border-color: var(--gold); color: var(--gold);">
          ✨ Crear Cuenta (Cliente, Cocina o Delivery)
        </a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://utmmswvwqrqdxzobzakv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0bW1zd3Z3cXJxZHh6b2J6YWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTU2NTksImV4cCI6MjEwNTU5MTY1OX0.ykNc6yhpgUqJWQKMMWKOVgYY-JA0UP25SxLRQKUB_Vc';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function redirigirPorRol(user) {
      const rol = user.user_metadata?.role;
      if (rol === 'restaurant') window.location.href = 'cocina.html';
      else if (rol === 'delivery') window.location.href = 'delivery.html';
      else if (rol === 'admin') window.location.href = 'admin.html';
      else window.location.href = 'index.html';
    }

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'Verificando...';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-pass').value;

      const { data, error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        errBox.style.display = 'block';
        errBox.innerText = 'Error: ' + error.message;
        btn.disabled = false;
        btn.innerText = 'Ingresar a mi Cuenta';
      } else if (data.user) {
        redirigirPorRol(data.user);
      }
    });
  </script>
</body>
</html>
