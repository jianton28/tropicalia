<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tropicalia Kitchen</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Conexión a Supabase directa desde CDN, sin instalar nada -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div class="container header-content">
      <div>
        <h1>Tropicalia Kitchen</h1>
        <p>Catálogo y pedidos en línea</p>
      </div>
      <button id="btn-ver-carrito" class="btn-secundario">
        🛒 Carrito (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <main class="container main-layout">
    <!-- Catálogo de productos -->
    <section class="catalogo-seccion">
      <h2>Menú Disponible</h2>
      <div id="loading" class="alerta">Cargando menú desde la base de datos...</div>
      <div id="grid-productos" class="grid-productos"></div>
    </section>

    <!-- Panel lateral del Carrito -->
    <aside class="carrito-seccion">
      <h2>Tu Pedido</h2>
      <div id="carrito-vacio" class="alerta">El carrito está vacío</div>
      <div id="carrito-items" class="carrito-items"></div>
      
      <div class="carrito-total">
        <span>Total:</span>
        <strong id="carrito-total-precio">$0.00</strong>
      </div>

      <form id="form-pedido" class="formulario-pedido" style="display: none;">
        <h3>Datos de Entrega</h3>
        <input type="text" id="cliente-nombre" placeholder="Tu nombre" required />
        <input type="tel" id="cliente-telefono" placeholder="Número de WhatsApp" required />
        <textarea id="cliente-direccion" placeholder="Dirección de entrega" rows="2" required></textarea>
        <button type="submit" class="btn-primario">Confirmar y Enviar Pedido</button>
      </form>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
